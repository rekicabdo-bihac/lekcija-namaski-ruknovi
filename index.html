function render(){nav();document.getElementById('status').textContent=stages[stage];let m=document.getElementById('main');if(stage==0){m.innerHTML=`${imgBlock()}<h2>📚 Nauči šest namaskih ruknova</h2><div class="grid">${R.map((x,i)=>`<div class="rukn" onclick="beep(true);this.querySelector('p').classList.toggle('hidden')"><div class="big">${i+1}. ${x[0]}</div><p>${x[1]}</p></div>`).join('')}</div><p><b>Zapamti:</b> namaskih ruknova ima šest. Svi se moraju izvršiti da bi namaz bio ispravan.</p>`;return}
 if(stage==1)return question('Spoji opis sa odgovarajućim ruknom',q%6,'desc');
 if(stage==2){if(!order.length)order=[...R.keys()].sort(()=>Math.random()-.5);m.innerHTML=`<h2>🔢 Složi ruknove redom</h2><p>Pritiskaj kartice od prvog do šestog rukna.</p><div class="seq">${order.map(i=>`<button class="chip" onclick="pickOrder(${i},this)">${R[i][0]}</button>`).join('')}</div><p id="seqout"></p>${imgBlock()}`;return}
 if(stage==3)return missing();
 if(stage==4)return question('Koji rukn odgovara ovom značenju?',q%6,'desc');
 if(stage==5)return question('⚡ Brzi izazov',Math.floor(Math.random()*6),Math.random()<.5?'desc':'name');
 if(stage==6)return exam();}
let seqNext=0;function pickOrder(i,b){clickSound();if(i==seqNext){beep(true);b.classList.add('ok');b.disabled=true;seqNext++;setScore(10);if(seqNext==6){document.getElementById('seqout').innerHTML='<b>🎉 Odlično! Redoslijed je tačan.</b>';seqNext=0;order=[]}}else{beep(false);b.classList.add('bad');setScore(-3);setTimeout(()=>b.classList.remove('bad'),500)}}
function choices(correct){let arr=[correct];while(arr.length<4){let x=Math.floor(Math.random()*6);if(!arr.includes(x))arr.push(x)}return arr.sort(()=>Math.random()-.5)}
function question(title,correct,mode){let prompt=mode=='desc'?R[correct][1]:`Koji opis pripada ruknu: ${R[correct][0]}?`;let cs=choices(correct);document.getElementById('main').innerHTML=`<h2>${title}</h2><p class="big">${prompt}</p>${cs.map(i=>`<button class="opt" onclick="answer(${i},${correct},this)">${mode=='desc'?R[i][0]:R[i][1]}</button>`).join('')}${q%2==0?imgBlock():''}`}
function answer(i,c,b){clickSound();if(i==c){beep(true);b.classList.add('ok');setScore(10);setTimeout(()=>{q++;render()},650)}else{beep(false);b.classList.add('bad');setScore(-3)}}
function missing(){let miss=q%6;let names=R.map(x=>x[0]);let shown=names.map((x,i)=>i==miss?'❓':x).join(' → ');let cs=choices(miss);document.getElementById('main').innerHTML=`<h2>❓ Šta nedostaje?</h2><div class="seq">${shown.split(' → ').map(x=>`<span class="chip">${x}</span>`).join('')}</div><p>Koji rukn nedostaje?</p>${cs.map(i=>`<button class="opt" onclick="answer(${i},${miss},this)">${R[i][0]}</button>`).join('')}`}

"Bismilla", "Jedna sura"], "c": 1}, {"q": "Poslije Fatihe na prvom stajanju prema lekciji učimo:", "a": ["Jednu suru iz Kur'ana", "Et-Tehijjatu", "Selam", "Kunut-dovu"], "c": 0}, {"q": "Koji rukn obuhvata učenje Kur'ana u namazu?", "a": ["Kijam", "Kiraet", "Ruku'", "Sedžda"], "c": 1}, {"q": "Šta je ruku'?", "a": ["Sjedenje u namazu", "Pregibanje u namazu", "Učenje Kur'ana", "Predavanje selama"], "c": 1}, {"q": "Kako se savijamo na ruku'u?", "a": ["Do polovine tijela tako da leđa budu ravna", "Sjedamo na pete", "Spuštamo čelo na tlo", "Ostajemo potpuno uspravni"], "c": 0}, {"q": "Šta obuhvatimo rukama na ruku'u?", "a": ["Ramena", "Koljena", "Stopala", "Glavu"], "c": 1}, {"q": "Gdje gledamo dok smo na ruku'u prema lekciji?", "a": ["U nožne prste i tri puta učimo propisani zikr", "U strop", "Iza sebe", "Udesno"], "c": 0}, {"q": "Šta učimo na ruku'u?", "a": ["Subhane Rabbijel-Azim", "Subhane Rabbijel-E'ala", "Et-Tehijjatu", "Rabbena atina"], "c": 0}, {"q": "Koliko puta prema lekciji učimo „Subhane Rabbijel-Azim“ na ruku'u?", "a": ["Jednom", "Dva puta", "Tri puta", "Pet puta"], "c": 2}, {"q": "Šta znači „Subhane Rabbijel-Azim“ prema lekciji?", "a": ["Hvala Allahu, Gospodaru svjetova", "Slavljen je moj Gospodar Veličanstveni", "Allah čuje onoga ko Ga hvali", "Gospodaru, oprosti mi"], "c": 1}, {"q": "Šta je sedžda prema naslovu lekcije?", "a": ["Stajanje u namazu", "Spuštanje lica na tlo", "Učenje Kur'ana", "Završni selam"], "c": 1}, {"q": "Šta prvo spuštamo kada idemo na sedždu prema lekciji?", "a": ["Čelo", "Koljena", "Nos", "Laktove"], "c": 1}, {"q": "Šta se prema lekciji spušta nakon koljena?", "a": ["Dlanovi ruku", "Stopala", "Ramena", "Leđa"], "c": 0}, {"q": "Šta se na kraju spušta na tlo pri odlasku na sedždu?", "a": ["Samo ruke", "Čelo i nos", "Laktovi", "Ramena"], "c": 1}, {"q": "Kako su ruke postavljene na sedždi?", "a": ["Iza leđa", "Za širinu lica razmaknute", "Na koljenima", "Spojene iznad glave"], "c": 1}, {"q": "Šta učimo na sedždi?", "a": ["Subhane Rabbijel let examOrder=[];
function exam(){if(!examOrder.length&&q===0)examOrder=[...Array(EXAM.length).keys()].sort(()=>Math.random()-.5);if(q>=50){document.getElementById('main').innerHTML=`<h2>🏆 ZAVRŠNI ISPIT ZAVRŠEN</h2><p class="big">Završio/la si svih 50 zadataka!</p><p>Ukupno bodova: <b>${score}</b></p>${imgBlock()}<button class="btn" onclick="q=0;score=0;examOrder=[];setScore(0);render()">Ponovi ispit</button>`;beep(true);return}let e=EXAM[examOrder[q]], opts=e.a.map((t,i)=>({t,ok:i===e.c})).sort(()=>Math.random()-.5);document.getElementById('main').innerHTML=`<h2>🎓 Završni ispit — ${q+1}/50</h2><p class="big">${e.q}</p>${opts.map(o=>`<button class="opt" onclick="examAns(${o.ok},this)">${o.t}</button>`).join('')}${q%5==0?imgBlock():''}`}
function examAns(ok,b){clickSound();if(ok){beep(true);b.classList.add('ok');setScore(10);document.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(()=>{q++;render()},500)}else{beep(false);b.classList.add('bad');b.disabled=true;setScore(-3)}}
render();
</script></body></html>
